<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 秘書検定準1級 ぷちかわクイズ 🌸</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: M PLUS Rounded 1c & Zen Maru Gothic -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yumekawa: {
              pink: '#ffb7d5',
              softpink: '#fff0f6',
              hotpink: '#ff66a3',
              purple: '#e2b0ff',
              lightpurple: '#f5e6ff',
              mint: '#adffe4',
              softmint: '#e6fff7',
              yellow: '#fff3a8',
              sky: '#b0eeff',
            }
          },
          fontFamily: {
            rounded: ['"M PLUS Rounded 1c"', '"Zen Maru Gothic"', 'sans-serif'],
          },
          boxShadow: {
            yumecard: '0 15px 35px -5px rgba(255, 138, 186, 0.35), 0 0 20px 0 rgba(226, 176, 255, 0.25)',
            yumebtn: '0 8px 0px 0px #ff94c2, 0 10px 15px rgba(255, 102, 163, 0.3)',
            yumebtnActive: '0 2px 0px 0px #ff94c2, 0 4px 8px rgba(255, 102, 163, 0.3)',
            neonPink: '0 0 15px rgba(255, 102, 163, 0.6)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #ffeef5 0%, #f7e8ff 50%, #e6fdff 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 浮遊する背景パーツ (花びら・ハート) */
    .floating-item {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      animation: floatUp 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* ぷよぷよアニメーション */
    .puyo-hover:hover {
      animation: puyo 0.6s ease infinite alternate;
    }

    @keyframes puyo {
      0% { transform: scale(1); }
      30% { transform: scale(1.04, 0.96); }
      60% { transform: scale(0.97, 1.03); }
      100% { transform: scale(1.02, 0.98); }
    }

    /* キラキラ揺れ効果 */
    .sparkle-anim {
      animation: sparkle 2s ease-in-out infinite alternate;
    }

    @keyframes sparkle {
      0% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 4px #ffb7d5); }
      100% { transform: scale(1.08) rotate(3deg); filter: drop-shadow(0 0 10px #ff66a3); }
    }

    /* 正解時のフワッと出現 */
    .pop-in {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-3 sm:p-6 relative select-none">

  <!-- 浮遊する背景アイコンコンテナ -->
  <div id="floating-bg" class="fixed inset-0 pointer-events-none overflow-hidden"></div>

  <!-- クイズアプリカード容器 -->
  <div class="w-full max-w-xl bg-white/90 backdrop-blur-md border-4 border-yumekawa-pink/70 rounded-[35px] p-5 sm:p-8 shadow-yumecard relative z-10 transition-all duration-300 my-auto">

    <!-- ヘッダーバナー -->
    <div class="text-center mb-5">
      <div class="inline-flex items-center gap-2 bg-gradient-to-r from-yumekawa-softpink via-white to-yumekawa-lightpurple text-yumekawa-hotpink font-extrabold px-5 py-1.5 rounded-full text-xs sm:text-sm mb-2 shadow-sm border-2 border-yumekawa-pink/50 sparkle-anim">
        <span>🎀 秘書検定準1級 対策 🎀</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-gray-700 tracking-wide drop-shadow-sm">
        秘書のマナー<span class="text-yumekawa-hotpink">クイズ</span>🌸
      </h1>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="text-center py-4">
      <div class="w-28 h-28 mx-auto mb-4 relative">
        <div class="absolute inset-0 bg-yumekawa-pink/30 rounded-full blur-xl animate-pulse"></div>
        <div class="w-full h-full bg-gradient-to-br from-yumekawa-pink to-yumekawa-purple rounded-full flex items-center justify-center text-5xl shadow-lg border-4 border-white relative z-10">
          👑
        </div>
      </div>

      <h2 class="text-xl sm:text-2xl font-black text-gray-700 mb-2">めざせ！エレガント秘書🌸</h2>
      <p class="text-xs sm:text-sm text-gray-500 font-bold mb-6 leading-relaxed">
        準1級レベルのビジネスマナー全5問！<br>
        全問正解して「最高にエレガントな秘書」を目指してね✨
      </p>

      <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-yumekawa-hotpink to-yumekawa-purple hover:from-yumekawa-hotpink hover:to-yumekawa-pink text-white font-black py-4 px-6 rounded-3xl shadow-yumecard puyo-hover active:translate-y-1 active:shadow-none transition-all text-lg flex items-center justify-center gap-2 border-2 border-white">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>クイズをはじめる！</span>
      </button>
    </div>

    <!-- クイズ進行画面（初期非表示） -->
    <div id="quiz-screen" class="hidden">
      <!-- プログレス表示 -->
      <div class="mb-5 bg-yumekawa-softpink/80 p-3 rounded-2xl border-2 border-yumekawa-pink/40">
        <div class="flex justify-between items-center text-xs sm:text-sm font-black text-gray-600 mb-2">
          <span class="flex items-center gap-1.5 text-yumekawa-hotpink">
            <i class="fa-solid fa-heart text-yumekawa-hotpink animate-bounce"></i>
            <span id="question-number">第 1 問</span>
          </span>
          <span id="progress-text" class="text-yumekawa-hotpink">1 / 5</span>
        </div>
        <!-- パステルプログレスバー -->
        <div class="w-full bg-white h-4 rounded-full overflow-hidden p-0.5 border border-yumekawa-pink/50 shadow-inner">
          <div id="progress-bar" class="bg-gradient-to-r from-yumekawa-pink via-yumekawa-hotpink to-yumekawa-purple h-full rounded-full transition-all duration-300 w-1/5 shadow-sm"></div>
        </div>
      </div>

      <!-- 問題文カード -->
      <div class="bg-gradient-to-br from-white to-yumekawa-softpink/60 border-2 border-yumekawa-pink/50 rounded-2xl p-4 sm:p-5 mb-5 shadow-sm relative overflow-hidden">
        <div class="absolute -right-3 -top-3 text-4xl opacity-15 pointer-events-none">🌸</div>
        <p id="question-text" class="text-gray-700 font-bold text-sm sm:text-base leading-relaxed relative z-10">
          読み込み中...
        </p>
      </div>

      <!-- 選択肢リスト -->
      <div id="options-container" class="space-y-3 mb-5">
        <!-- JavaScriptで動的作成 -->
      </div>

      <!-- 解説表示ボックス -->
      <div id="explanation-box" class="hidden rounded-2xl p-4 mb-5 text-xs sm:text-sm leading-relaxed border-2 pop-in">
        <div class="flex items-center gap-2 font-black mb-1.5 text-sm sm:text-base" id="explanation-title">
          <!-- 成否アイコン＆メッセージ -->
        </div>
        <p id="explanation-text" class="text-gray-600 font-bold mt-1">
          <!-- 解説本文 -->
        </p>
      </div>

      <!-- つぎへボタン -->
      <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-gradient-to-r from-yumekawa-hotpink to-yumekawa-purple text-white font-black py-3.5 px-6 rounded-2xl shadow-yumebtn active:translate-y-1 active:shadow-yumebtnActive transition-all duration-150 flex items-center justify-center gap-2 text-base puyo-hover">
        <span>つぎの問題へ進む</span>
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>
    </div>

    <!-- 結果表示画面（初期非表示） -->
    <div id="result-screen" class="hidden text-center py-3">
      <div class="text-6xl mb-3 sparkle-anim inline-block" id="result-emoji">🎉</div>
      <h2 class="text-2xl font-black text-gray-700 mb-1">チャレンジ完了！</h2>
      <p class="text-xs text-gray-400 font-extrabold mb-4">おつかれさまでした🌸</p>

      <!-- 結果カード -->
      <div class="bg-gradient-to-br from-yumekawa-softpink via-white to-yumekawa-lightpurple border-3 border-yumekawa-pink/60 rounded-3xl p-5 sm:p-6 mb-6 shadow-inner relative overflow-hidden">
        <div class="text-xs font-bold text-gray-500 mb-1">あなたの正解数は…</div>
        <div class="text-4xl sm:text-5xl font-black text-yumekawa-hotpink mb-4 drop-shadow-sm">
          <span id="final-score">0</span> <span class="text-xl text-gray-500">/ 5 問</span>
        </div>

        <!-- 称号バッジ -->
        <div id="rank-badge" class="inline-block bg-white border-2 border-yumekawa-pink text-yumekawa-hotpink font-black px-6 py-2 rounded-full text-base sm:text-lg shadow-md mb-3">
          👑 完璧なエレガント秘書🌸
        </div>

        <p id="rank-comment" class="text-xs sm:text-sm text-gray-600 font-bold leading-relaxed px-2">
          コメントがここに入ります。
        </p>
      </div>

      <!-- リトライボタン -->
      <button onclick="restartQuiz()" class="w-full bg-gradient-to-r from-yumekawa-hotpink to-yumekawa-purple text-white font-black py-4 px-6 rounded-2xl shadow-yumecard active:scale-95 transition-all flex items-center justify-center gap-2 puyo-hover text-base">
        <i class="fa-solid fa-rotate-right"></i>
        <span>もう一度クイズに挑戦する🌸</span>
      </button>
    </div>

  </div>

  <script>
    // 秘書検定準1級 5問題データ
    const quizData = [
      {
        question: "1. 上司（部長）の元に社外の取引先から電話がありました。部長は現在不在です。適切な応対はどれでしょう？",
        options: [
          "「〇〇部長はただいま席を外しております」",
          "「部長の〇〇はただいま席を外しております」",
          "「〇〇はあいにく席を外しております」",
          "「〇〇様はただいま席を外しております」"
        ],
        answer: 2, // 0-indexed: index 2 -> 3
        explanation: "社外の人に対して社内の人間（上司）について話す際は、役職名を付けず名前のみ（または「部長の〇〇」）で呼び捨てにするのがマナーです。"
      },
      {
        question: "2. 来客を応接室へご案内します。ドアが「外開き（手前に開く）」の場合、秘書の動きとして適切なものはどれでしょう？",
        options: [
          "ドアを開けて先に部屋に入り、ドアを押さえてお客様を通す",
          "ドアを手前に開き、ドアを押さえたままお客様を先に入室させる",
          "ドアを押し開けて、お客様の後に続いて入室する",
          "ノックをしてからそのまま立ち去り、お客様だけに入室してもらう"
        ],
        answer: 0, // 0-indexed: index 0 -> 1
        explanation: "外開きのドアの場合、お客様の進行方向を遮らないよう、秘書が先に開けて室内に入り、ドアを押さえながらお客様を招き入れます。"
      },
      {
        question: "3. 上司から急ぎの書類作成を頼まれましたが、すでに別の指示を受けていて締め切りが重なっています。適切な判断はどれでしょう？",
        options: [
          "無理をしてでも両方を時間内に終わらせるよう一人で頑張る",
          "後から頼まれた方を断り、先に来た仕事だけを終わらせる",
          "優先順位を上司に確認し、どちらを優先すべきか指示を仰ぐ",
          "同僚に黙って自分の仕事を押し付ける"
        ],
        answer: 2, // 0-indexed: index 2 -> 3
        explanation: "業務の優先順位が判断できない場合や指示が競合した場合は、上司に現在の状況を伝え、指示を仰ぐのが秘書として適切な行動です。"
      },
      {
        question: "4. 応接室で3名の社外のお客様をお迎えする際、最も「上座」となる席はどこでしょう？",
        options: [
          "入口から一番近い席",
          "入口から一番遠い（奥の）長椅子（ソファー）の席",
          "入口から一番遠い（奥の）1人掛けチェアー",
          "中央の席"
        ],
        answer: 1, // 0-indexed: index 1 -> 2
        explanation: "応接室では「入口から一番遠い奥の席」が上座となります。ソファーと1人掛けチェアがある場合は、長椅子（ソファー）側がより上座です。"
      },
      {
        question: "5. 上司にお茶（日本茶）をお出しする際のマナーとして正しいものはどれでしょう？",
        options: [
          "お客様の左側から出し、茶たくは付けずにそのまま出す",
          "お客様の右側から出し、茶たくと湯のみは別々に運んで出す直前にセットする",
          "テーブルの真ん中にまとめて置いてお客様に取ってもらう",
          "お茶をなみなみと縁まで注いで出す"
        ],
        answer: 1, // 0-indexed: index 1 -> 2
        explanation: "お茶は基本的に「お客様の右後ろ（または右側）」から出します。運ぶ際は茶たくに湯のみを乗せず別々に運び、お出しする直前に茶たくに乗せます。"
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let isAnswered = false;

    // Web Audio API による効果音生成（外部音声ファイル不要）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
          // キラリン音（ド・ミ・ソ・ド）
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'incorrect') {
          // ブブー（低いポワポワ音）
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now); // A3
          osc.frequency.setValueAtTime(180, now + 0.15);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'click') {
          // ポップ音
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {
        // AudioContextが制限されている場合等は音をスキップ
      }
    }

    // 背景のふわふわパーティクル作成
    function initFloatingBg() {
      const container = document.getElementById('floating-bg');
      const icons = ['🌸', '✨', '💖', '🎀', '🧸', '☁️'];
      const count = 16;

      for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = 'floating-item';
        item.innerText = icons[Math.floor(Math.random() * icons.length)];
        item.style.left = `${Math.random() * 100}%`;
        item.style.fontSize = `${Math.random() * 16 + 14}px`;
        item.style.animationDelay = `${Math.random() * 8}s`;
        item.style.animationDuration = `${Math.random() * 6 + 7}s`;
        container.appendChild(item);
      }
    }

    // クイズ開始
    function startQuiz() {
      playSound('click');
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      currentIdx = 0;
      score = 0;
      loadQuestion();
    }

    // 問題読み込み
    function loadQuestion() {
      isAnswered = false;
      const q = quizData[currentIdx];

      // プログレス更新
      document.getElementById('question-number').innerText = `第 ${currentIdx + 1} 問`;
      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

      // 問題文
      document.getElementById('question-text').innerText = q.question;

      // 選択肢
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `option-btn w-full text-left bg-white border-2 border-yumekawa-pink/60 hover:border-yumekawa-hotpink hover:bg-yumekawa-softpink rounded-2xl p-3.5 sm:p-4 text-xs sm:text-sm font-bold text-gray-700 transition-all duration-200 flex items-center justify-between shadow-sm active:scale-[0.98] puyo-hover`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-yumekawa-pink/30 text-yumekawa-hotpink flex items-center justify-center font-black text-xs shrink-0">${idx + 1}</span>
            <span>${opt}</span>
          </div>
          <i class="fa-regular fa-heart text-yumekawa-pink text-base shrink-0 ml-2"></i>
        `;
        btn.onclick = () => checkAnswer(idx, btn);
        container.appendChild(btn);
      });

      // UIリセット
      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');
    }

    // 回答判定
    function checkAnswer(selectedIdx, btnEl) {
      if (isAnswered) return;
      isAnswered = true;

      const q = quizData[currentIdx];
      const isCorrect = selectedIdx === q.answer;
      const buttons = document.querySelectorAll('.option-btn');

      // 全ボタン操作禁止
      buttons.forEach(b => b.style.pointerEvents = 'none');

      const expBox = document.getElementById('explanation-box');
      const expTitle = document.getElementById('explanation-title');
      const expText = document.getElementById('explanation-text');

      if (isCorrect) {
        score++;
        playSound('correct');

        // 正解演出スタイル
        btnEl.className = 'option-btn w-full text-left border-2 border-yumekawa-mint bg-yumekawa-softmint text-gray-800 rounded-2xl p-3.5 sm:p-4 text-xs sm:text-sm font-bold flex items-center justify-between shadow-md pop-in';
        btnEl.querySelector('i').className = 'fa-solid fa-circle-check text-emerald-500 text-lg shrink-0 ml-2 animate-bounce';

        expBox.className = 'rounded-2xl p-4 mb-5 text-xs sm:text-sm leading-relaxed border-2 bg-yumekawa-softmint border-yumekawa-mint/80 text-gray-700 block pop-in';
        expTitle.className = 'flex items-center gap-2 font-black text-emerald-600 mb-1 text-sm sm:text-base';
        expTitle.innerHTML = `<i class="fa-solid fa-sparkles"></i> 🌸 だいせいかい！すばらしいです🌸`;

        // キラキラ紙吹雪
        confetti({
          particleCount: 35,
          spread: 60,
          origin: { y: 0.65 },
          colors: ['#ffb7d5', '#e2b0ff', '#adffe4', '#fff3a8']
        });

      } else {
        playSound('incorrect');

        // 不正解演出スタイル
        btnEl.className = 'option-btn w-full text-left border-2 border-yumekawa-hotpink bg-yumekawa-softpink text-gray-800 rounded-2xl p-3.5 sm:p-4 text-xs sm:text-sm font-bold flex items-center justify-between shadow-sm';
        btnEl.querySelector('i').className = 'fa-solid fa-heart-crack text-yumekawa-hotpink text-lg shrink-0 ml-2';

        // 正解の選択肢をハイライト
        const correctBtn = buttons[q.answer];
        correctBtn.classList.add('border-yumekawa-mint', 'bg-yumekawa-softmint');

        expBox.className = 'rounded-2xl p-4 mb-5 text-xs sm:text-sm leading-relaxed border-2 bg-yumekawa-softpink border-yumekawa-pink text-gray-700 block pop-in';
        expTitle.className = 'flex items-center gap-2 font-black text-yumekawa-hotpink mb-1 text-sm sm:text-base';
        expTitle.innerHTML = `<i class="fa-solid fa-face-sad-tear"></i> ざんねん…！復習しよう✨`;
      }

      expText.innerText = q.explanation;
      document.getElementById('next-btn').classList.remove('hidden');
    }

    // 次の問題へ
    function nextQuestion() {
      playSound('click');
      currentIdx++;
      if (currentIdx < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    // 結果発表
    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      const resultScreen = document.getElementById('result-screen');
      resultScreen.classList.remove('hidden');

      document.getElementById('final-score').innerText = score;

      const emoji = document.getElementById('result-emoji');
      const badge = document.getElementById('rank-badge');
      const comment = document.getElementById('rank-comment');

      if (score === 5) {
        emoji.innerText = '👑🌸✨';
        badge.innerText = '👑 完璧なエレガント秘書🌸';
        badge.className = 'inline-block bg-gradient-to-r from-yumekawa-hotpink via-yumekawa-purple to-yumekawa-pink text-white font-black px-6 py-2.5 rounded-full text-base sm:text-lg shadow-lg sparkle-anim border-2 border-white';
        comment.innerText = 'パーフェクト全問正解！気配りとマナー知識は完璧です✨ 自信を持って試験や実務に臨んでくださいね！';

        // 盛大な紙吹雪でお祝い
        const duration = 2.5 * 1000;
        const animationEnd = Date.now() + duration;
        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) return clearInterval(interval);
          confetti({
            particleCount: 40,
            startVelocity: 30,
            spread: 360,
            origin: { x: Math.random(), y: Math.random() - 0.2 },
            colors: ['#ffb7d5', '#ff66a3', '#e2b0ff', '#fff3a8', '#adffe4']
          });
        }, 300);

      } else if (score >= 3) {
        emoji.innerText = '✨🎀🌸';
        badge.innerText = '✨ すてきな秘書見習い✨';
        badge.className = 'inline-block bg-yumekawa-softpink border-2 border-yumekawa-pink text-yumekawa-hotpink font-black px-6 py-2 rounded-full text-base sm:text-lg shadow-md';
        comment.innerText = '合格ラインクリアです！あと少しでパーフェクト✨ 間違えた問題を振り返って満点を目指してみてね！';
      } else {
        emoji.innerText = '🌱🐣🎀';
        badge.innerText = '伸びしろいっぱいひよこ秘書🐣';
        badge.className = 'inline-block bg-yumekawa-lightpurple border-2 border-yumekawa-purple text-purple-700 font-black px-6 py-2 rounded-full text-base sm:text-lg shadow-md';
        comment.innerText = 'おつかれさまでした！マナーは繰り返し復習することで自然と身につきます。もう一度挑戦してみましょう🌸';
      }
    }

    // 再挑戦
    function restartQuiz() {
      playSound('click');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    // 初期起動
    window.onload = function() {
      initFloatingBg();
    };
  </script>
</body>
</html>
